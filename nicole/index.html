<!doctype html><html lang="en"><head><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Clientbook"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clientbook · Nicole</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=gambarino@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f3ee;--card:#fffdfa;--ink:#221d19;--mute:#7a6f66;--line:#e6ddd3;--acc:#8a4b2f;--acc2:#f1e4da;--ok:#3f6b4e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Satoshi,system-ui,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:18px 20px 8px;max-width:900px;margin:auto}
header h1{font:400 26px Gambarino,serif;margin:0}
nav{display:flex;gap:6px;padding:8px 20px;max-width:900px;margin:auto;overflow-x:auto}
nav button{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:99px;cursor:pointer;font:inherit;white-space:nowrap}
nav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
main{max-width:900px;margin:auto;padding:12px 20px 60px}
h2{font:400 22px Gambarino,serif;margin:22px 0 8px}.sub{color:var(--mute);font-size:13px;margin:-4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.name{font-weight:700}.meta{color:var(--mute);font-size:13px}
.tag{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:99px;padding:2px 9px;font-size:12px;margin:2px 4px 2px 0}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:9px 14px;font:500 14px Satoshi;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn:disabled{opacity:.5}
textarea,input{width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff}
textarea{min-height:70px;margin:8px 0}
.drop{border:1.5px dashed #cdbfb2;border-radius:14px;padding:30px;text-align:center;background:var(--card);cursor:pointer}
table{width:100%;border-collapse:collapse}td{padding:4px}td input{padding:6px}
.empty{color:var(--mute);text-align:center;padding:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.grid .card{cursor:pointer;margin:0}.num{font:400 28px Gambarino,serif}
@media(max-width:600px){td{display:block}tr{display:block;border-bottom:1px solid var(--line);padding:6px 0}}
body.ro #cs,body.ro #ra,body.ro #is,body.ro .btn.ghost:not([onclick^="go"]){display:none}body.ro::before{content:"View only";position:fixed;bottom:12px;right:12px;background:var(--ink);color:#fff;padding:4px 10px;border-radius:99px;font-size:12px}
</style></head><body>
<header><svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-label="Clientbook"><rect x="5" y="4" width="20" height="24" rx="3" stroke="currentColor" stroke-width="2"/><path d="M11 4v24" stroke="currentColor" stroke-width="2"/><circle cx="19" cy="14" r="3" fill="#8a4b2f"/></svg><h1>Clientbook</h1></header>
<nav><button data-t="today" class="on">Today</button><button data-t="add">Add sales</button><button data-t="interests">Interests</button><button data-t="brands">Brands</button><button data-t="clients">Clients</button></nav>
<main id="v"></main>
<script>
const API="https://ibyhyccxkzknbuanclkw.supabase.co/functions/v1/clientbook";const $=s=>document.querySelector(s);const V=$("#v");
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const TODAY=iso(new Date());const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let PW="";try{PW=localStorage.getItem("cbpw_nicole")||""}catch(e){}let ROLE="";
const j=(p,o={})=>fetch(API+p,{...o,headers:{...(o.headers||{}),"x-pass":PW}}).then(r=>{if(r.status==401){try{localStorage.removeItem("cbpw_nicole")}catch(e){};showLogin();throw new Error("login")}if(r.status==403){alert("View-only access: changes aren't allowed.");throw new Error("ro")}return r.json()});const post=(p,b,m="POST")=>j(p,{method:m,headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});
const first=n=>(n||"").split(" ")[0];const brandsOf=it=>[...new Set(it.map(x=>x.brand).filter(Boolean))].join(" and ");
const sms=(ph,body)=>`sms:${ph}${/iPhone|iPad/.test(navigator.userAgent)?"&":"?"}body=${encodeURIComponent(body)}`;
let IG="https://www.instagram.com/laurenp_elysewalker";let IGM={};
const igl=e=>(!IG||IGM[e.customer_id])?"":` Follow me on Instagram for new arrivals: ${IG}`;
const cleanItem=s=>String(s||"").replace(/\s*\(.*?\)\s*/g," ").replace(/\s+[–—-]\s+.*$/,"").replace(/,\s*(XXS|XS|S|M|L|XL|XXL|\d+(\.\d+)?)\s*$/i,"").replace(/\s+/g," ").trim().toLowerCase();
const niceBrand=b=>{b=String(b||"").trim();return b&&b===b.toUpperCase()?b.toLowerCase().replace(/(^|[\s\/-])(\p{L})/gu,(m,p,c)=>p+c.toUpperCase()):b};
const itemsTxt=it=>{const seen=new Set();const L=[...it].sort((a,b)=>(b.amount||0)-(a.amount||0)).map(x=>[niceBrand(x.brand),cleanItem(x.item)].filter(Boolean).join(" ")).filter(s=>s&&!seen.has(s.toLowerCase())&&seen.add(s.toLowerCase()));if(!L.length)return "pieces";if(L.length>3)return L.slice(0,3).join(", ")+" and other items";return L.length>1?L.slice(0,-1).join(", ")+" and "+L.at(-1):L[0]};
const tpl={thank:e=>`Hi ${first(e.name)}! Thank you so much for shopping with me. I hope you love your new ${itemsTxt(e.items)}! Let me know if you need anything at all.${igl(e)}`,
follow:e=>`Hi ${first(e.name)}! It's been about a month since you picked up your ${brandsOf(e.items)||"pieces"} — how are you loving them? We have some beautiful new arrivals I'd love to show you.${igl(e)}`,
lapsed:e=>`Hi ${first(e.name)}! It's been a little while and I've been thinking of you. We have so many new pieces in${e.brands?` — including some ${e.brands.split(",")[0]}`:""}. Would love to see you soon!${igl(e)}`,
bday:e=>`Happy birthday, ${first(e.name)}! Wishing you the most beautiful day. Come celebrate with us — I'd love to help you pick out something special.${igl(e)}`,
wish:(n,b,e={})=>`Hi ${first(n)}! You mentioned you love ${b} — we just got new pieces in and I thought of you right away. Want me to pull some for you to try?${igl(e)}`,
brand:(n,b,e={})=>`Hi ${first(n)}! We just got new ${b} in and I thought of you right away. Want me to set some pieces aside for you?${igl(e)}`};
function msgCard(e,kind,body,ids){const id="m"+Math.random().toString(36).slice(2);
 return `<div class="card"><div class="row"><div><div class="name">${esc(e.name)}</div><div class="meta">${e.date?("Purchased "+e.date+" · "):""}${esc(e.phone||"no phone on file")}</div></div></div>
 <div>${(e.items||[]).map(i=>`<span class="tag">${esc(i.brand||"—")}${i.item?" · "+esc(i.item):""}</span>`).join("")}</div>
 <textarea id="${id}">${esc(body)}</textarea><div class="row" style="justify-content:flex-start">
 ${e.phone?`<a class="btn" href="#" onclick="location.href=sms('${e.phone}',document.getElementById('${id}').value);return false">Open text</a>`:`<button class="btn" disabled>No phone</button>`}
 ${ids?`<button class="btn ghost" onclick="done(this,'${kind}','${ids}',${e.customer_id||0})">Mark done</button>`:""}${e.touch?`<button class="btn ghost" onclick="touch(this,'${kind}',${e.customer_id})">Mark done</button>`:""}</div></div>`}
async function touch(b,kind,id){post("/api/ig/"+id,{});IGM[id]=1;await post("/api/touch",{kind,customer_id:id,date:TODAY});b.closest(".card").remove()}
async function done(b,kind,ids,cid){if(cid){post("/api/ig/"+cid,{});IGM[cid]=1}await post("/api/mark",{kind,sale_ids:ids.split(",").map(Number)});b.closest(".card").remove()}
const views={
async today(){const LD=+(window.__ld||90);const d=await j("/api/today?d="+TODAY+"&days="+LD);
 const bd=d.bdays.map(e=>msgCard({...e,touch:1,items:[]},"bday",tpl.bday(e))).join("");
 const lp=d.lapsed.map(e=>msgCard({...e,touch:1,date:e.last,items:(e.brands||"").split(",").filter(Boolean).map(b=>({brand:b}))},"lapsed",tpl.lapsed(e))).join("");
 const rm=d.rems.map(r=>`<div class="card"><div class="row"><div><div class="name" style="cursor:pointer" onclick="showClient(${r.customer_id})">${esc(r.name)}</div><div class="meta">${r.date} · ${esc(r.phone||"no phone")}</div></div></div><p style="margin:8px 0">${esc(r.note)}</p><div class="row" style="justify-content:flex-start">${r.phone?`<a class="btn" href="${sms(r.phone,"Hi "+first(r.name)+"! ")}">Open text</a>`:""}<button class="btn ghost" onclick="post('/api/reminder/${r.id}/done',{}).then(()=>this.closest('.card').remove())">Mark done</button></div></div>`).join("");
 V.innerHTML=`${rm?`<h2>Follow-up reminders</h2>${rm}`:""}${bd?`<h2>Birthdays today</h2>${bd}`:""}<h2>Thank-you texts</h2><p class="sub">Customers who bought yesterday (or earlier and haven't been thanked yet)</p>${d.thank.map(e=>msgCard(e,"thank",tpl.thank(e),e.sale_ids.join())).join("")||'<div class="empty">All caught up.</div>'}
 <h2>One-month check-ins</h2><p class="sub">Purchases from 30+ days ago</p>${d.follow.map(e=>msgCard(e,"follow",tpl.follow(e),e.sale_ids.join())).join("")||'<div class="empty">Nothing due today.</div>'}
 <h2>Haven't shopped in a while</h2><p class="sub">No purchase in <select id="ld">${[60,90,120,180].map(n=>`<option ${n==LD?"selected":""}>${n}</option>`).join("")}</select> days and not contacted since</p>${lp||'<div class="empty">Everyone\'s been in recently.</div>'}`;
 $("#ld").onchange=e=>{window.__ld=e.target.value;views.today()}},
async add(){V.innerHTML=`<h2>Add today's sales</h2><p class="sub">Snap a photo of your POS screen or sales report. Review what was read, fix anything, then save.</p>
 <label class="drop" id="drop"><input type="file" accept="image/*" capture="environment" hidden id="f"><div class="num">+</div>Take or upload a photo</label>
 <div id="rv"></div>`;
 $("#f").onchange=async e=>{const file=e.target.files[0];if(!file)return;$("#rv").innerHTML='<div class="empty">Reading your photo…</div>';
  const fd=new FormData();fd.append("file",file);try{const r=await j("/api/scan",{method:"POST",body:fd});if(r.error){$("#rv").innerHTML='<div class="empty">'+esc(r.error)+'</div>';review([],TODAY);return}review(r.lines||[],r.date||TODAY)}catch(x){$("#rv").innerHTML='<div class="empty">Couldn\'t read that photo. Try again or add lines by hand.</div>';review([],TODAY)}};
 review([],TODAY,true)},
async brands(){const b=await j("/api/brands");const u=await j("/api/untagged");V.innerHTML=`<h2>New merchandise in?</h2><p class="sub">Pick a brand to see everyone who's bought it before.</p>
 <input id="bq" placeholder="Search a brand…" style="margin-bottom:12px"><div class="grid">${b.map(x=>`<div class="card" data-b="${esc(x.brand)}"><div class="name">${esc(x.brand)}</div><div class="meta">${x.n} client${x.n>1?"s":""}</div></div>`).join("")||'<div class="empty">No brands yet — add some sales first.</div>'}</div><div id="bl"></div>
 ${u.length?`<h2>Items missing a brand (${u.length})</h2><p class="sub">Your report shows style names only. Type the brand once and it's applied to every client who bought that item.</p>${u.map(x=>`<div class="card row"><div><div class="name">${esc(x.item)}</div><div class="meta">${x.n} sold</div></div><div class="row" style="flex-wrap:nowrap"><input placeholder="Brand" style="width:160px"><button class="btn" onclick="tagIt(this,'${esc(x.item).replace(/'/g,"\\'")}')">Save</button></div></div>`).join("")}`:""}`;
 V.querySelectorAll("[data-b]").forEach(c=>c.onclick=()=>showBrand(c.dataset.b));
 $("#bq").oninput=e=>V.querySelectorAll("[data-b]").forEach(c=>c.style.display=c.dataset.b.toLowerCase().includes(e.target.value.toLowerCase())?"":"none")},
async interests(){const L=await j("/api/interests");
 V.innerHTML=`<h2>Client interests</h2><p class="sub">Brands a client loves but hasn't bought from you yet. They'll show up on that brand's list when new merchandise arrives.</p>
 <div class="card"><input id="in" placeholder="Client name" style="margin-bottom:6px"><input id="ip" placeholder="Phone (optional)" style="margin-bottom:6px"><input id="ib" placeholder="Brand" style="margin-bottom:6px"><textarea id="io" placeholder="Details — pieces, sizes, colors (optional)"></textarea><button class="btn" id="is">Save interest</button></div>
 <h2>All interests (${L.length})</h2>${L.map(x=>`<div class="card row"><div><div class="name">${esc(x.name)} <span class="tag">${esc(x.brand)}</span>${x.bought?'<span class="tag" style="background:#e3eee6;color:#3f6b4e">Purchased</span>':""}</div><div class="meta">${x.date}${x.note?" · "+esc(x.note):""}</div></div><button class="btn ghost" onclick="post('/api/interest/${x.id}',{},'DELETE').then(views.interests)">Remove</button></div>`).join("")||'<div class="empty">No interests saved yet.</div>'}`;
 $("#is").onclick=async()=>{const name=$("#in").value.trim(),brand=$("#ib").value.trim();if(!name||!brand)return alert("Add a client name and brand.");
  await post("/api/interest",{name,phone:$("#ip").value,brand,note:$("#io").value,date:TODAY});views.interests()}},
async clients(){const c=await j("/api/customers");V.innerHTML=`<div class="row"><h2>Clients</h2><button class="btn ghost" id="impb">Import contacts</button></div><div id="imp"></div><div class="row" style="flex-wrap:nowrap;margin-bottom:12px"><input id="cq" placeholder="Search name or phone…"><label class="meta" style="white-space:nowrap"><input type="checkbox" id="cc" style="width:auto"> Has store credit</label></div><div id="cl">${c.map(x=>`<div class="card" data-cr="${x.store_credit>0?1:0}" data-c="${x.id}" data-s="${esc((x.name+" "+x.phone).toLowerCase())}" style="cursor:pointer"><div class="row"><div><div class="name">${esc(x.name)}</div><div class="meta">${x.custno?"#"+esc(x.custno)+" · ":""}${esc(x.phone||"no phone")} · ${x.n} purchase${x.n==1?"":"s"}${x.last?" · last "+x.last:""}</div></div></div><div>${x.store_credit>0?`<span class="tag" style="background:#e3eee6;color:#3f6b4e">Credit $${Number(x.store_credit).toLocaleString(undefined,{minimumFractionDigits:2})}</span>`:""}${(x.brands||"").split(",").filter(Boolean).map(b=>`<span class="tag">${esc(b)}</span>`).join("")}</div></div>`).join("")||'<div class="empty">No clients yet.</div>'}</div>`;
 V.querySelectorAll("[data-c]").forEach(e=>e.onclick=()=>showClient(e.dataset.c));
 const F=()=>V.querySelectorAll("[data-c]").forEach(c=>c.style.display=c.dataset.s.includes($("#cq").value.toLowerCase())&&(!$("#cc").checked||c.dataset.cr=="1")?"":"none");$("#cq").oninput=F;$("#impb").onclick=importUI;$("#cc").onchange=F}};
function review(lines,date,blank){if(blank&&!lines.length){lines=[]}
 const row=l=>`<tr><td><input placeholder="Customer name" value="${esc(l.name)}"></td><td><input placeholder="Phone" value="${esc(l.phone)}"></td><td><input placeholder="Brand" value="${esc(l.brand)}"></td><td><input placeholder="Item" value="${esc(l.item)}"></td><td><input placeholder="$" value="${l.amount??""}" style="width:80px"></td><td><input type="date" title="Birthday (optional)" value="${esc(l.birthday)}"></td><td><button class="btn ghost" onclick="this.closest('tr').remove()">✕</button></td></tr>`;
 $("#rv").innerHTML=`<h2>${blank?"Or enter by hand":"Review sales"}</h2><div class="card"><label class="meta">Sale date <input type="date" id="sd" value="${date}" style="width:auto"></label>
 <label class="meta" style="display:block;margin:8px 0"><input type="checkbox" id="hist" style="width:auto"> These are older sales — don't queue thank-yous or check-ins that are already past due</label><table id="tb">${(lines.length?lines:[{}]).map(row).join("")}</table>
 <div class="row" style="margin-top:10px"><button class="btn ghost" id="al">+ Add line</button><button class="btn" id="sv">Save sales</button></div></div>`;
 $("#al").onclick=()=>$("#tb").insertAdjacentHTML("beforeend",row({}));
 $("#sv").onclick=async()=>{const d=$("#sd").value;let last={};const out=[...$("#tb").querySelectorAll("tr")].map(tr=>{const v=[...tr.querySelectorAll("input")].map(i=>i.value.trim());
  const name=v[0]||last.name, phone=v[1]||(v[0]?"":last.phone);last={name,phone};return{name,phone:phone||"",brand:v[2],item:v[3],amount:v[4]?parseFloat(v[4].replace(/[^0-9.]/g,"")):null,date:d,birthday:v[5]||""}}).filter(l=>l.name);
  if(!out.length)return alert("Add at least one customer name.");const r=await post("/api/sales?today="+TODAY+"&history="+$("#hist").checked,out);$("#rv").innerHTML=`<div class="card"><div class="name">Saved ${r.count} item${r.count>1?"s":""}.</div><div class="meta">Thank-you texts will show up tomorrow on the Today tab, and check-ins in 30 days.</div></div>`}}
async function tagIt(b,item){const v=b.previousElementSibling.value.trim();if(!v)return;await post('/api/tag',{item,brand:v});views.brands()}
async function showBrand(b){const r=await j("/api/brand?b="+encodeURIComponent(b));
 const W=r.interested;const R=r.bought;$("#bl").innerHTML=`<h2>${esc(b)} clients (${R.length})</h2><p class="sub">Edit the message, then tap Open text for each person.</p>`+R.map(x=>msgCard({customer_id:x.id,touch:1,name:x.name,phone:x.phone,date:x.last,items:[{brand:b,item:x.items}]},"brand",tpl.brand(x.name,b,{customer_id:x.id}))).join("")+(W.length?`<h2>Interested, not purchased yet (${W.length})</h2>`+W.map(x=>msgCard({customer_id:x.id,touch:1,name:x.name,phone:x.phone,date:x.last,items:[{brand:b,item:x.items}]},"brand",tpl.wish(x.name,b,{customer_id:x.id}))).join(""):"");$("#bl").scrollIntoView({behavior:"smooth"})}
function importUI(){$("#imp").innerHTML=`<div class="card"><div class="name">Import contacts from your iPhone</div><p class="meta">In Contacts: tap Lists, press and hold All Contacts, tap Export, then Save to Files. Choose that .vcf file below. Only contacts whose company contains the word below are imported.</p>
 <label class="meta">Company contains<input id="kw" value="client" style="margin:4px 0 8px"></label><input type="file" id="vf" accept=".vcf,text/vcard,text/x-vcard"><div id="vr"></div></div>`;
 $("#vf").onchange=async e=>{const f=e.target.files[0];if(!f)return;$("#vr").innerHTML='<div class="empty">Reading contacts…</div>';const fd=new FormData();fd.append("file",f);
  const r=await j("/api/vcf/preview?keyword="+encodeURIComponent($("#kw").value),{method:"POST",body:fd});const M=r.matches;
  $("#vr").innerHTML=`<p class="meta" style="margin-top:10px">Found ${M.length} client contact${M.length==1?"":"s"} out of ${r.total}. Uncheck anyone you don't want.</p>${M.map((x,i)=>`<label class="row" style="justify-content:flex-start;flex-wrap:nowrap;padding:4px 0"><input type="checkbox" data-i="${i}" checked style="width:auto"><span><b>${esc(x.name)}</b> <span class="meta">${esc(x.phone||"no phone")} · ${esc(x.org)}${x.existing?" · already in Clientbook (will fill in missing info)":""}</span></span></label>`).join("")}${M.length?'<button class="btn" id="vc" style="margin-top:8px">Import selected</button>':""}`;
  if(M.length)$("#vc").onclick=async()=>{const sel=[...$("#vr").querySelectorAll("[data-i]:checked")].map(b=>M[b.dataset.i]);const o=await post("/api/vcf/commit",sel);$("#imp").innerHTML=`<div class="card"><div class="name">Imported: ${o.new} new client${o.new==1?"":"s"}, ${o.updated} updated.</div></div>`;setTimeout(()=>views.clients(),1500)}}}
async function showClient(id){const c=await j("/api/customer/"+id);V.innerHTML=`<button class="btn ghost" onclick="go('clients')">← Clients</button><h2>${esc(c.name)}</h2>
 <div class="card"><input id="cn" value="${esc(c.name)}" style="margin-bottom:6px"><input id="cp" value="${esc(c.phone)}" placeholder="Phone" style="margin-bottom:6px"><input id="ce" value="${esc(c.email)}" placeholder="Email" style="margin-bottom:6px"><label class="meta">Store credit ($)<input id="csc" type="number" step="0.01" value="${c.store_credit||""}" style="margin-bottom:6px"></label><label class="meta">Birthday <input type="date" id="cb" value="${esc(c.birthday)}" style="margin-bottom:6px"></label><h3 class="meta" style="margin:10px 0 4px;text-transform:uppercase;letter-spacing:.06em">Sizes &amp; fit</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 6px">${[["shoe","Shoe size"],["top","Top size"],["pant","Bottom size"],["belt","Belt size"],["hat","Hat size"]].map(([k,l])=>{const m=(c[k]||"").match(/^(US|IT|FR) (.*)$/);const sys=m?m[1]:"US",v=m?m[2]:(c[k]||"");return `<label class="meta">${l}<div style="display:flex;gap:4px"><select id="zs_${k}" style="border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit">${["US","IT","FR"].map(o=>`<option ${o==sys?"selected":""}>${o}</option>`).join("")}</select><input id="z_${k}" value="${esc(v)}"></div></label>`}).join("")}<label class="meta">Fit preference (baggy, tailored…)<input id="z_fit" value="${esc(c.fit)}"></label></div><label class="meta">Aversions (e.g. holes in jeans)<textarea id="z_aversions" style="min-height:50px;margin-top:2px">${esc(c.aversions)}</textarea></label><textarea id="cno" placeholder="Notes — sizes, preferences, birthdays…">${esc(c.notes)}</textarea><button class="btn" id="cs">Save</button></div>
 <h2>Follow-up reminders</h2><div class="card"><div class="row" style="flex-wrap:nowrap"><input type="date" id="rd" style="width:auto"><input id="rn" placeholder="e.g. Ask how her daughter's wedding went"><button class="btn" id="ra">Add</button></div>
 ${c.reminders.map(r=>`<div class="row" style="margin-top:8px;${r.done?"opacity:.5":""}"><div><span class="tag">${r.date}</span> ${esc(r.note)}${r.done?" · done":""}</div><button class="btn ghost" onclick="post('/api/reminder/${r.id}',{},'DELETE').then(()=>showClient(${id}))">Delete</button></div>`).join("")}</div>
 ${c.interests.length?`<h2>Interested in</h2><div class="card">${c.interests.map(i=>`<span class="tag">${esc(i.brand)}${i.note?" · "+esc(i.note):""}</span>`).join("")}</div>`:""}<h2>Purchases</h2>${c.sales.map(s=>`<div class="card row"><div><span class="tag">${esc(s.brand||"—")}</span> ${esc(s.item||"")} ${s.amount?"· $"+s.amount:""}<div class="meta">${s.date} · ${s.thanked?"thanked":"thank-you pending"} · ${s.followed?"checked in":"check-in pending"}</div></div><button class="btn ghost" onclick="post('/api/sale/${s.id}',{}, 'DELETE').then(()=>showClient(${id}))">Delete</button></div>`).join("")}`;
 $("#ra").onclick=async()=>{const d=$("#rd").value,n=$("#rn").value.trim();if(!d||!n)return alert("Pick a date and write the reminder.");await post("/api/reminder",{customer_id:+id,date:d,note:n});showClient(id)};
 $("#cs").onclick=async()=>{await post("/api/customer/"+id,{name:$("#cn").value,phone:$("#cp").value,notes:$("#cno").value,birthday:$("#cb").value,...Object.fromEntries(["shoe","pant","top","belt","hat"].map(k=>[k,$("#z_"+k).value.trim()?$("#zs_"+k).value+" "+$("#z_"+k).value.trim():""])),fit:$("#z_fit").value,aversions:$("#z_aversions").value,email:$("#ce").value,store_credit:parseFloat($("#csc").value)||0},"PUT");$("#cs").textContent="Saved"}}
async function go(t){try{IGM=await j("/api/igmap")}catch(e){}document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==t));views[t]()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.t));
function showLogin(msg){document.querySelector("nav").style.display="none";V.innerHTML=`<div class="card" style="max-width:360px;margin:40px auto"><h2 style="margin-top:0">Sign in</h2><p class="sub">${msg||"Enter your Clientbook password."}</p><form onsubmit="return false"><input type="text" autocomplete="username" value="clientbook" hidden><input type="password" id="pw" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="current-password" placeholder="Password" style="margin-bottom:10px"><button class="btn" id="lg">Sign in</button></form></div>`;
 const t=async()=>{const r=await fetch(API+"/api/login",{headers:{"x-pass":$("#pw").value.trim()}});if(!r.ok)return showLogin("That password didn't work. Try again.");PW=$("#pw").value.trim();try{localStorage.setItem("cbpw_nicole",PW)}catch(e){};ROLE=(await r.json()).role;start()};
 $("#lg").onclick=t;$("#pw").onkeydown=e=>{if(e.key=="Enter")t()};$("#pw").focus()}
async function start(){try{const c=await j("/api/config");IG=c.ig||"";if(c.owner)document.querySelector("header h1").textContent="Clientbook · "+c.owner}catch(e){}document.querySelector("nav").style.display="";if(ROLE=="view"){document.querySelector('[data-t="add"]').style.display="none";document.body.classList.add("ro")}go("today")}
(async()=>{if(!PW)return showLogin();const r=await fetch(API+"/api/login",{headers:{"x-pass":PW}});if(!r.ok)return showLogin();ROLE=(await r.json()).role;start()})();
</script></body></html>
